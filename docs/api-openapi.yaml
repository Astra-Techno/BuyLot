        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                buyer_notification_message:
                  type: string
                  maxLength: 500
                  nullable: true
                  description: Optional custom message to include in buyer notification.
      responses:
        '200':
          description: Offer published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '401':
