          description: Approval decision recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'
        '429':
          $ref: '#/components/responses/429TooManyRequests'

  /v1/internal/offers/{id}/publish:
    post:
      tags: [Internal]
      summary: Publish an approved offer to buyers
      description: |
        Makes an approved offer visible to group members. After publication the
        offer terms are immutable; version is incremented. Buyers will be notified.

        **Required permission:** `offers:publish`
      operationId: publishOffer
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
