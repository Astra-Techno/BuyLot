  # --------------------------------------------------------------------------
  # WEBHOOKS
  # --------------------------------------------------------------------------

  /v1/webhooks/payments/{provider}:
    post:
      tags: [Webhooks]
      summary: Receive inbound payment webhook
      description: |
        Receives payment event callbacks from payment providers (e.g., Razorpay, Cashfree).

        **Security controls (MUST all pass before processing):**
        1. Signature verification using provider-specific HMAC or RSA method against raw request body.
        2. Timestamp/replay attack check: reject events older than 5 minutes.
        3. Idempotency check: `payment_webhook_events(provider, provider_event_id)` must be UNIQUE;
           duplicate deliveries are acknowledged (200) without reprocessing.
        4. Processing is fully asynchronous via queue; this endpoint only persists and enqueues.

        **No authentication header required** (webhook is called by provider, not by our users).
        The route is not behind BearerAuth; it uses signature-based auth instead.

        Supported providers: `razorpay`, `cashfree` (expand per integration).
      operationId: receivePaymentWebhook
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [razorpay, cashfree]
      requestBody:
        required: true
        description: |
          Raw JSON body from the payment provider. The exact schema varies by provider
          and event type. The body is stored as-is in payload_ref before parsing.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: Provider-defined webhook payload. See provider documentation for event schemas.
              example:
                event: payment.captured
                payload:
                  payment:
                    entity:
                      id: pay_ExampleId123
                      order_id: order_ExampleOrderId
                      amount: 50000
                      currency: INR
                      status: captured
      responses:
        '200':
          description: |
            Webhook acknowledged. Processing is asynchronous.
            Returns 200 even for duplicate events (idempotent acknowledgement).
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [accepted, duplicate]
                  event_id:
                    type: string
                    description: Internal event ID assigned on first receipt.
        '400':
          description: |
            Malformed payload (missing required provider fields).
            Note: signature failures return 400, NOT 401, to avoid leaking auth method.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
