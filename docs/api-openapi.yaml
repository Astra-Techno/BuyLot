  /v1/internal/inspections/{id}/complete:
    post:
      tags: [Internal]
      summary: Complete an inspection
      description: |
        Records the final inspection result for a shipment/order.
        Triggers downstream settlement eligibility recalculation for affected items.

        **Required permission:** `inspections:complete`
      operationId: completeInspection
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result, checklist_snapshot]
              properties:
                result:
                  type: string
                  enum: [passed, failed, partial, not_required]
                checklist_snapshot:
                  type: object
                  additionalProperties: true
                  description: Completed inspection checklist items as a JSON snapshot.
                findings:
                  type: array
                  items:
                    type: object
                    required: [order_item_id, finding_type, qty_affected]
                    properties:
                      order_item_id:
                        type: string
                        pattern: '^[0-9A-Z]{26}$'
                      finding_type:
                        type: string
                        enum: [conforming, non_conforming, damaged, missing, quantity_short]
                      qty_affected:
                        type: integer
                        minimum: 0
                      evidence_ref:
                        type: string
                        nullable: true
                notes:
                  type: string
                  maxLength: 5000
                  nullable: true
      responses:
        '200':
          description: Inspection completed.
          content:
            application/json:
              schema:
                type: object
                required: [id, order_id, result, completed_at]
                properties:
                  id:
                    type: string
                    pattern: '^[0-9A-Z]{26}$'
                  order_id:
                    type: string
                    pattern: '^[0-9A-Z]{26}$'
                  shipment_id:
                    type: string
                    pattern: '^[0-9A-Z]{26}$'
