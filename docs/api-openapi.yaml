              schema:
                $ref: '#/components/schemas/OfflineQuote'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'
        '429':
          $ref: '#/components/responses/429TooManyRequests'

  /v1/internal/rfqs/{id}/confidential-bids:
    get:
      tags: [Internal]
      summary: View confidential bids for an RFQ
      description: |
        Returns all sealed bids for an RFQ including full revision history and pricing.
        This endpoint is strictly access-controlled. Access is denied to:
        - Buyers (any role)
        - Sellers (including the bidding seller viewing other sellers' bids)
        - Support agents without explicit procurement lead or compliance role

        Access is logged to the audit trail on every call.

        **Required permission:** `bids:read:confidential` (procurement lead, compliance, super admin only)
      operationId: listConfidentialBids
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Confidential bids for the RFQ.
          content:
            application/json:
              schema:
                type: object
                required: [rfq_id, bids]
                properties:
                  rfq_id:
                    type: string
                    pattern: '^[0-9A-Z]{26}$'
                  bids:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/SellerBid'
                        - type: object
                          properties:
                            revisions:
                              type: array
                              items:
                                $ref: '#/components/schemas/SellerBidRevision'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'

  /v1/internal/offers:
    post:
      tags: [Internal]
      summary: Create a negotiated offer (draft)
      description: |
        Internal staff creates a draft offer based on a winning bid revision or
        an offline quote. The offer is not visible to buyers until published.

        **Required permission:** `offers:create`
      operationId: createInternalOffer
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group_id, seller_id, expires_at, price_tiers, terms_snapshot]
              properties:
                group_id:
                  type: string
                  pattern: '^[0-9A-Z]{26}$'
                seller_id:
                  type: string
                  pattern: '^[0-9A-Z]{26}$'
                source_bid_revision_id:
                  type: string
                  pattern: '^[0-9A-Z]{26}$'
                  nullable: true
                  description: Winning bid revision if sourced online; null for offline-sourced offers.
                expires_at:
                  type: string
                  format: date-time
                price_tiers:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [min_paid_qty, unit_price_paise]
                    properties:
                      min_paid_qty:
                        type: integer
                        minimum: 1
                      max_paid_qty:
                        type: integer
                        nullable: true
                      unit_price_paise:
                        type: integer
                        minimum: 1
                terms_snapshot:
                  type: object
                  additionalProperties: true
                  description: Full commercial terms to be presented to buyers.
      responses:
        '201':
          description: Offer draft created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '422':
          $ref: '#/components/responses/422UnprocessableEntity'
        '429':
          $ref: '#/components/responses/429TooManyRequests'

  /v1/internal/offers/{id}/approve:
    post:
      tags: [Internal]
      summary: Approve an offer
      description: |
        Records a procurement lead / finance approver approval decision on a draft offer.
        An offer cannot be approved by the same person who created it (maker-checker).

        **Required permission:** `offers:approve`
      operationId: approveOffer
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
